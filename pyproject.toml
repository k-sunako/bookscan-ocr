[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookscan-ocr"
version = "0.1.0"
description = "Batch OCR for scanned books with PaddleOCR or Tesseract"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "ocrmypdf>=17.13.0",
]

[project.scripts]
bookscan-ocr = "bookscan_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
